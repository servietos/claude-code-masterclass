<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1260" width="1920" height="1260" role="img">
<title>parallel() barrier between two nodes and three verifiers</title>
<desc>The script splits the task into a node for Controllers/ and Shared/ and a node for test-controllers.http. The parallel() barrier waits for the slower node and merges in the script body. Three verifiers with the correctness, security and reproduction lens run at once, and the vote is counted in code.</desc>
