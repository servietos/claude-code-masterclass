  <text x="1112" y="664" class="m b">.claude/rules/copilot-studio.md</text>
  <text x="1112" y="710" class="m s" style="font-size:30px">paths: src/cs-schema/agents/**</text>
  <text x="1140" y="769" class="s" style="font-size:30px">Where the agents live</text>
