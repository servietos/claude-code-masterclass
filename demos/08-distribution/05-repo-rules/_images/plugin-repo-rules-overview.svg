<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">A marketplace plugin's expert reads the repo's rule first</title>
  <desc id="d">The Copilot Studio plugin from integrations-marketplace installs globally into ~/.claude with its copilot-studio-expert agent and the copilot-studio and work-iq skills. The expert first reads the repo's .claude/rules/copilot-studio.md, scoped to src/cs-schema/agents, which says where the agents live, where cloned workflows go, which topic file is a proven example and where the CS- rebuilds sit.</desc>
